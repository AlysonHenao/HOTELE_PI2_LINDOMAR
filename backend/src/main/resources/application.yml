spring:
  application:
    name: lindomar-api
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lindomar}
    username: ${SPRING_DATASOURCE_USERNAME:lindomar}
    password: ${SPRING_DATASOURCE_PASSWORD:lindomar}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
server:
  port: 8080

hotel:
  time-zone: ${HOTEL_TIME_ZONE:America/Bogota}
  check-in-time: ${HOTEL_CHECK_IN_TIME:15:00}
  cancellation:
    advance-hours: ${HOTEL_CANCELLATION_ADVANCE_HOURS:2}

